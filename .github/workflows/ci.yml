name: CI

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (curl_cffi needs libcurl)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev build-essential

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: python -W error::RuntimeWarning -m pytest tests/ -v

      - name: Run Ruff
        run: python -m ruff check src tests scripts

      - name: MCP protocol smoke test
        if: matrix.python-version == '3.11'
        run: python scripts/mcp_smoke_test.py

      - name: Build distribution
        if: matrix.python-version == '3.11'
        run: |
          python -m build
          python -m twine check dist/*

      - name: Verify wheel installation
        if: matrix.python-version == '3.11'
        run: |
          python -m venv /tmp/cn-scraper-wheel
          /tmp/cn-scraper-wheel/bin/pip install --no-deps dist/*.whl
          /tmp/cn-scraper-wheel/bin/python -c "from importlib.metadata import version; import cn_scraper_mcp; assert cn_scraper_mcp.__version__ == version('cn-scraper-mcp')"

      - name: Platform health check (mock)
        run: python scripts/platform_health.py --mock --json

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cn-scraper-mcp:ci .

      - name: Start HTTP transport container
        run: |
          docker run -d --name cn-scraper-mcp-ci \
            -p 8000:8000 \
            -e CN_SCRAPER_TRANSPORT=http \
            -e CN_SCRAPER_HOST=0.0.0.0 \
            -e CN_SCRAPER_PORT=8000 \
            -e CN_SCRAPER_PATH=/mcp \
            cn-scraper-mcp:ci

      - name: Wait for HTTP endpoint
        run: |
          for i in $(seq 1 30); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/mcp || true)"
            if [ "$status" != "000" ]; then
              echo "HTTP endpoint responded with status $status"
              exit 0
            fi
            docker logs cn-scraper-mcp-ci --tail 50 || true
            sleep 2
          done
          echo "HTTP endpoint did not respond in time"
          docker logs cn-scraper-mcp-ci || true
          exit 1

      - name: Show Docker logs
        if: always()
        run: docker logs cn-scraper-mcp-ci || true

      - name: Stop Docker container
        if: always()
        run: docker rm -f cn-scraper-mcp-ci || true
